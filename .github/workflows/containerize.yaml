name: containerize
on: [push]

permissions:
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm clean-install
      - run: npm run test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Sync compose.yaml and deploy latest container on EC2
        working-directory: /home/ssm-user/ship-dashboard
        run: |
          printf 'services:\n  board:\n    image: ghcr.io/sityhelimi-arch/ship-dashboard:latest\n    ports:\n      - "80:3000"\n    environment:\n      SHIPIT_TOKEN: infratify\n' > compose.yaml
          docker compose pull
          docker compose up -d
          docker image prune -f
